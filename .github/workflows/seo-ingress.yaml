name: seo — inspect ingress robots header

# Read-only. Changes nothing. Locates the Traefik IngressRoute serving oro.fun
# and the middleware chain that injects `X-Robots-Tag: noindex, nofollow`.
on:
  workflow_dispatch:

jobs:
  look:
    runs-on: [self-hosted, oro]
    timeout-minutes: 10

    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p $RUNNER_TEMP/.kube
          echo '${{ secrets.KUBECONFIG }}' | base64 -d > $RUNNER_TEMP/.kube/config
          chmod 600 $RUNNER_TEMP/.kube/config
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> $GITHUB_ENV

      - name: IngressRoutes — host to middleware mapping
        run: |
          kubectl get ingressroute -A -o custom-columns=\
          'NS:.metadata.namespace,NAME:.metadata.name,MATCH:.spec.routes[*].match,MW:.spec.routes[*].middlewares[*].name' || true

      - name: Which IngressRoute mentions oro.fun (full spec)
        run: |
          for ir in $(kubectl get ingressroute -A -o custom-columns=NS:.metadata.namespace,N:.metadata.name --no-headers | tr -s ' ' '/'); do
            ns=${ir%%/*}; name=${ir##*/}
            if kubectl -n $ns get ingressroute $name -o yaml | grep -q "oro.fun"; then
              echo "════════ $ns/$name ════════"
              kubectl -n $ns get ingressroute $name -o yaml \
                | grep -viE "^\s*(creationTimestamp|resourceVersion|uid|generation|managedFields|last-applied)" || true
            fi
          done

      - name: Every Traefik middleware, full spec
        run: |
          kubectl get middleware -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name || true
          echo "──────── specs ────────"
          for mw in $(kubectl get middleware -A -o custom-columns=NS:.metadata.namespace,N:.metadata.name --no-headers | tr -s ' ' '/'); do
            echo "════════ $mw ════════"
            kubectl -n ${mw%%/*} get middleware ${mw##*/} -o jsonpath='{.spec}' | tr ',' '\n' || true
            echo
          done
