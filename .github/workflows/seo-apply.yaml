name: seo — apply oro.fun indexable headers

# Applies k8s/pwa-headers-middleware.yaml + k8s/oro-pwa-ingressroute.yaml.
# Touches ONLY the oro.fun route. The shared `secure-headers` middleware is not
# modified, so api / admin / grafana stay noindex.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        default: ''

jobs:
  apply:
    if: github.event.inputs.confirm == 'apply'
    runs-on: [self-hosted, oro]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p $RUNNER_TEMP/.kube
          echo '${{ secrets.KUBECONFIG }}' | base64 -d > $RUNNER_TEMP/.kube/config
          chmod 600 $RUNNER_TEMP/.kube/config
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> $GITHUB_ENV

      - name: Diff before applying
        run: |
          kubectl diff -f k8s/pwa-headers-middleware.yaml -f k8s/oro-pwa-ingressroute.yaml || true

      - name: Apply
        run: kubectl apply -f k8s/pwa-headers-middleware.yaml -f k8s/oro-pwa-ingressroute.yaml

      - name: Confirm shared middleware untouched
        run: |
          echo "── secure-headers must still say noindex ──"
          kubectl -n traefik get middleware secure-headers -o jsonpath='{.spec.headers.customResponseHeaders}'; echo
          echo "── pwa-headers should say index, follow ──"
          kubectl -n traefik get middleware pwa-headers -o jsonpath='{.spec.headers.customResponseHeaders}'; echo
          echo "── route middleware chains ──"
          kubectl get ingressroute -A -o custom-columns='NAME:.metadata.name,MATCH:.spec.routes[*].match,MW:.spec.routes[*].middlewares[*].name'

      - name: Verify live headers
        run: |
          sleep 10
          for h in oro.fun api.oro.fun admin.oro.fun tma.oro.fun; do
            printf '%-16s ' "$h"
            curl -sI -m 10 "https://$h/" | grep -i '^x-robots-tag' || echo '(none)'
          done
          echo
          echo "EXPECT: oro.fun -> index, follow   |   the other three -> noindex, nofollow"
